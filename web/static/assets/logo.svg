<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F29D" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#00F29D" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Escudo Hexagonal Externo -->
  <polygon points="50,6 90,26 90,74 50,94 10,74 10,26" 
           fill="#0A0E13" 
           stroke="url(#mintGrad)" 
           stroke-width="2.5" 
           stroke-linejoin="round"
           filter="url(#glow)"/>

  <!-- Linhas Estruturais Facetadas -->
  <line x1="50" y1="6" x2="50" y2="30" stroke="#00F29D" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="90" y1="26" x2="70" y2="38" stroke="#00F29D" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="90" y1="74" x2="70" y2="62" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="50" y1="94" x2="50" y2="70" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="10" y1="74" x2="30" y2="62" stroke="#00F29D" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="10" y1="26" x2="30" y2="38" stroke="#00F29D" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Anel Intermediário Diamante -->
  <polygon points="50,22 78,50 50,78 22,50" 
           fill="none" 
           stroke="#38BDF8" 
           stroke-width="1.8" 
           stroke-opacity="0.75"/>

  <!-- Aperture / Núcleo Central -->
  <polygon points="50,34 66,50 50,66 34,50" 
           fill="#061822" 
           stroke="#00F29D" 
           stroke-width="2"/>
  
  <!-- Foco Quântico Emissor -->
  <circle cx="50" cy="50" r="5" fill="url(#coreGrad)" filter="url(#glow)"/>
</svg>
