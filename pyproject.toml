[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ia-candidata"
version = "1.0.0"
description = "Harness de automação ética e calibrada de candidaturas a empregos"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Sustainable Use License 1.0 (SUL)" }
authors = [
    { name = "Rauan Bernardo Ribeiro de Araujo", email = "rauanbernardo@gmail.com" }
]
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "httpx>=0.27,<1",
    "openpyxl>=3.1,<4",
    "pypdf>=4.2",
    "google-api-python-client>=2.130",
    "google-auth>=2.29",
    "google-auth-oauthlib>=1.2",
    "playwright>=1.44",
    "camoufox[geoip]>=0.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "respx>=0.21",
    "aiohttp>=3.9",
    "ruff",
    "mypy",
]
laya = [
    "laya-mcp[mcp]>=0.2.2,<0.3",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["cache", "artifacts", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

