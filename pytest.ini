[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
pythonpath = .
markers =
    unit: testes unitários (sem rede, sem browser)
    integration: testes de integração (Playwright real, servidor local)
    laya_live: fumaça contra um sidecar laya-mcp real em LAYA_URL
addopts = -ra --strict-markers -m "not laya_live"
